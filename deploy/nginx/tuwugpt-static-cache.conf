# Public, versioned bundles only. Do not include this snippet on HTML, API,
# account, billing, CAPTCHA, streaming or WebSocket locations.
proxy_cache tuwugpt_assets;
proxy_cache_methods GET HEAD;
proxy_cache_convert_head on;
proxy_cache_key "$scheme://$host$request_uri";
proxy_cache_valid 200 30d;
proxy_cache_valid 301 302 1h;
proxy_cache_lock on;
proxy_cache_lock_timeout 10s;
proxy_cache_lock_age 30s;
proxy_cache_background_update on;
proxy_cache_revalidate on;
proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;

# Static bundles never need a user session upstream. Keeping cookies out of
# this path prevents cache fragmentation and prevents any response cookie from
# being replayed through a cached asset.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
proxy_no_cache $upstream_http_set_cookie;

add_header X-Tuwu-Asset-Cache $upstream_cache_status always;
