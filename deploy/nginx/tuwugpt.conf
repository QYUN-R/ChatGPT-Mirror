server {
    listen 80;
    listen [::]:80;
    server_name www.tuwugpt.com;

    root /var/www/letsencrypt;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tuwugpt.com;

    ssl_certificate /etc/letsencrypt/live/www.tuwugpt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.tuwugpt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    location = / {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_read_timeout 120s;
        sub_filter_once off;
        sub_filter "/cdn/assets/" "/edge/assets/";
        sub_filter "https://cdn.openai.com/" "/external/cdn-openai/";
        add_header Cache-Control "private, no-store, no-transform" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /admin/assets/ {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_read_timeout 60s;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store, no-transform" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /cdn/assets/ {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter "/cdn/assets/" "/edge/assets/";
        sub_filter "https://cdn.openai.com/" "/external/cdn-openai/";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /edge/assets/ {
        proxy_pass http://127.0.0.1:40002/cdn/assets/;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter "/cdn/assets/" "/edge/assets/";
        sub_filter "https://cdn.openai.com/" "/external/cdn-openai/";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /cdn/ {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter "/cdn/assets/" "/edge/assets/";
        sub_filter "https://cdn.openai.com/" "/external/cdn-openai/";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /external/cdn-openai/ {
        proxy_pass https://cdn.openai.com/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name cdn.openai.com;
        proxy_set_header Host cdn.openai.com;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        proxy_read_timeout 120s;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ~ ^/(backend-api/(conversation|codex)|api/(conversation|codex|refresh-cfbypass)) {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-transform" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location ^~ /0x/ {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_request_buffering on;
        proxy_cache off;
        proxy_read_timeout 180s;
        add_header Cache-Control "private, no-store, no-transform" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:40002;
        include /etc/nginx/snippets/tuwugpt-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        sub_filter_once off;
        sub_filter "/cdn/assets/" "/edge/assets/";
        sub_filter "https://cdn.openai.com/" "/external/cdn-openai/";
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "private, no-store, no-transform" always;
        include /etc/nginx/snippets/tuwugpt-security-headers.conf;
    }
}
